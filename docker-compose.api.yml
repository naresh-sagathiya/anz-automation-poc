services:
  api-mock:
    build:
      context: .
      dockerfile: Dockerfile.api-mock
    environment:
      PORT: 4010
      ACCESS_TOKEN_SECONDS: 2
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4010/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 15

  api-tests:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      API_BASE_URL: http://api-mock:4010
      ACCESS_TOKEN_SECONDS: 2
    depends_on:
      api-mock:
        condition: service_healthy