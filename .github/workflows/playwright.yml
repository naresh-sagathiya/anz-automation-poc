name: Playwright Tests

on:
  push:
    branches:
      - main
      - master
      - api-automation-integration

  pull_request:
    branches:
      - main
      - master

jobs:
  # =========================
  # API TESTS
  # =========================
  api:
    name: API shard ${{ matrix.shard }}
    timeout-minutes: 15
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start API mock server
        run: |
          mkdir -p reports

          nohup node api/mock-server/server.js \
            > reports/api-server.log 2>&1 &

          for attempt in {1..30}; do
            curl --fail http://localhost:4010/health && break
            sleep 1
          done

      - name: Run API shard
        env:
          API_BASE_URL: http://localhost:4010
          API_SHARD_INDEX: ${{ matrix.shard }}
          API_SHARD_COUNT: 4
        run: npm run test:api:shard

      - name: Upload API reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-report-${{ matrix.shard }}
          path: |
            reports/api-cucumber-report-${{ matrix.shard }}.*
            reports/api-server.log
          retention-days: 30

  # =========================
  # API LIFECYCLE
  # =========================
  api-lifecycle:
    name: API lifecycle
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lifecycle scenarios
        env:
          API_BASE_URL: http://localhost:4010
          ACCESS_TOKEN_SECONDS: 2
        run: |
          mkdir -p reports

          nohup node api/mock-server/server.js \
            > reports/api-lifecycle-server.log 2>&1 &

          for attempt in {1..30}; do
            curl --fail http://localhost:4010/health && break
            sleep 1
          done

          npm run test:api:lifecycle

      - name: Upload lifecycle artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-lifecycle-report
          path: |
            reports/api-cucumber-report.html
            reports/api-lifecycle-server.log
          retention-days: 30

  # =========================
  # SECRET SCAN
  # =========================
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================
  # PLAYWRIGHT
  # =========================
  test:
    name: Playwright tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # =========================
  # MOBILE CUCUMBER
  # =========================
  mobile:
    name: Mobile shard ${{ matrix.shard }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run mobile shard
        env:
          MOBILE_BASE_URL: ${{ vars.MOBILE_BASE_URL }}
          PARABANK_USER: ${{ secrets.PARABANK_USER }}
          PARABANK_PASS: ${{ secrets.PARABANK_PASS }}
          MOBILE_SHARD_INDEX: ${{ matrix.shard }}
          MOBILE_SHARD_COUNT: 2
        run: npm run test:mobile:shard

      - name: Upload mobile evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-report-${{ matrix.shard }}
          path: |
            reports/mobile-${{ matrix.shard }}.json
            reports/mobile-cucumber-report-${{ matrix.shard }}.html
          retention-days: 30

  # =========================
  # DEPLOY
  # =========================
  deploy:
    name: Deploy
    needs:
      - api
      - api-lifecycle
      - secret-scan
      - test
      - mobile

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          echo "All CI checks passed."
          echo "Starting deployment..."
          # Add actual deployment commands here
