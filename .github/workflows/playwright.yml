name: Playwright Tests
on:
  push:
    branches: [ main, master, api-automation-integration ]
  pull_request:
    branches: [ main, master ]
jobs:
  api:
    name: API shard ${{ matrix.shard }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Start API mock server
      run: |
        mkdir -p reports
        nohup node api/mock-server/server.js > reports/api-server.log 2>&1 &
        for attempt in {1..30}; do curl --fail http://localhost:4010/health && break || sleep 1; done
    - name: Run API shard
      env:
        API_BASE_URL: http://localhost:4010
        API_SHARD_INDEX: ${{ matrix.shard }}
        API_SHARD_COUNT: 4
      run: npm run test:api:shard
    - name: Upload API reports
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: api-report-${{ matrix.shard }}
        path: |
          reports/api-cucumber-report-${{ matrix.shard }}.*
          reports/api-server.log
        retention-days: 30

  api-lifecycle:
    name: API lifecycle
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Run token lifecycle scenarios
      env:
        API_BASE_URL: http://localhost:4010
        ACCESS_TOKEN_SECONDS: 2
      run: |
        nohup node api/mock-server/server.js > reports/api-lifecycle-server.log 2>&1 &
        for attempt in {1..30}; do curl --fail http://localhost:4010/health && break || sleep 1; done
        npm run test:api:lifecycle
    - name: Upload lifecycle artefacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: api-lifecycle-report
        path: |
          reports/api-cucumber-report.html
          reports/api-lifecycle-server.log
        retention-days: 30

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
